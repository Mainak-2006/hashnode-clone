# Render Blueprint for the Hashnode Clone API.
# Create a Blueprint from this repository, then fill in the secret values
# (MONGO_URI and CLIENT_URL) in the Render dashboard when prompted.
services:
  - type: web
    name: hashnode-clone-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
